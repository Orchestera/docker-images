name: Build and publish Spark runtime

on:
  pull_request:
    paths:
      - Dockerfile.spark
      - scripts/smoke-spark-runtime.sh
      - .github/workflows/publish-spark.yml
  push:
    branches: [main]
    paths:
      - Dockerfile.spark
      - scripts/smoke-spark-runtime.sh
      - .github/workflows/publish-spark.yml
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Optional immutable release tag in addition to the commit SHA
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: spark-runtime-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: orchestera/docker-images/spark
  SPARK_VERSION: 3.5.6

jobs:
  smoke:
    name: Build and smoke test (amd64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build runtime for smoke test
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ./Dockerfile.spark
          platforms: linux/amd64
          load: true
          tags: orchestera-spark-runtime:ci

      - name: Verify runtime contract
        run: ./scripts/smoke-spark-runtime.sh orchestera-spark-runtime:ci

  publish:
    name: Publish public runtime
    needs: smoke
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ env.SPARK_VERSION }},enable={{is_default_branch}}
            type=sha,format=long,prefix=sha-
            type=ref,event=tag
            type=raw,value=${{ inputs.tag }},enable=${{ inputs.tag != '' }}

      - name: Build and push runtime
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ./Dockerfile.spark
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true

      - name: Record immutable digest
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
        run: |
          {
            echo '### Published Spark runtime'
            echo
            echo "- Digest: \`${IMAGE}\`"
            echo "- Spark: \`${SPARK_VERSION}\`"
            echo '- Marimo: `0.24.2`'
            echo '- orchestera-lib: `0.1.0a4`'
          } >> "$GITHUB_STEP_SUMMARY"
